<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume Tailor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f0f13;
      color: #e4e4e7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 680px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #f4f4f5;
      margin-bottom: 0.3rem;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #71717a;
      margin-bottom: 2rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #a1a1aa;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .field { margin-bottom: 1.5rem; }

    .upload-area {
      border: 2px dashed #3f3f46;
      border-radius: 10px;
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }

    .upload-area:hover, .upload-area.dragover {
      border-color: #6366f1;
      background: rgba(99,102,241,0.05);
    }

    .upload-area input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .upload-icon { font-size: 2rem; margin-bottom: 0.5rem; }

    .upload-text {
      font-size: 0.9rem;
      color: #71717a;
    }

    .upload-text strong { color: #6366f1; }

    .file-name {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      color: #a1a1aa;
      min-height: 1.2em;
    }

    textarea {
      width: 100%;
      background: #09090b;
      border: 1px solid #27272a;
      border-radius: 8px;
      color: #e4e4e7;
      font-size: 0.9rem;
      font-family: inherit;
      padding: 0.875rem 1rem;
      resize: vertical;
      min-height: 180px;
      outline: none;
      transition: border-color 0.2s;
      line-height: 1.6;
    }

    textarea:focus { border-color: #6366f1; }
    textarea::placeholder { color: #52525b; }

    button[type="submit"] {
      width: 100%;
      padding: 0.875rem;
      background: #6366f1;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button[type="submit"]:hover { background: #4f46e5; }
    button[type="submit"]:active { transform: scale(0.98); }
    button[type="submit"]:disabled {
      background: #3f3f46;
      color: #71717a;
      cursor: not-allowed;
      transform: none;
    }

    .status {
      margin-top: 1.25rem;
      padding: 0.875rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }

    .status.loading {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: rgba(99,102,241,0.1);
      border: 1px solid rgba(99,102,241,0.3);
      color: #a5b4fc;
    }

    .status.error {
      display: block;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      color: #fca5a5;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(99,102,241,0.3);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .tag {
      display: inline-block;
      background: rgba(99,102,241,0.15);
      color: #818cf8;
      font-size: 0.75rem;
      padding: 0.2rem 0.6rem;
      border-radius: 99px;
      margin-bottom: 1.25rem;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="tag">Powered by Claude AI</div>
    <h1>Resume Tailor</h1>
    <p class="subtitle">Tailors your resume content to match any job description — format stays exactly the same.</p>

    <form id="tailorForm">
      <div class="field">
        <label>Your Resume (.docx or .pdf)</label>
        <div class="upload-area" id="uploadArea">
          <input type="file" id="resumeFile" name="resume" accept=".docx,.pdf" required />
          <div class="upload-icon">📄</div>
          <div class="upload-text"><strong>Click to upload</strong> or drag & drop</div>
          <div class="upload-text">.docx and .pdf files supported</div>
        </div>
        <div class="file-name" id="fileName"></div>
      </div>

      <div class="field">
        <label>Job Description</label>
        <textarea
          name="jd"
          id="jdText"
          placeholder="Paste the full job description here..."
          required
        ></textarea>
      </div>

      <button type="submit" id="submitBtn">Tailor My Resume</button>
    </form>

    <div class="status loading" id="loadingStatus">
      <div class="spinner"></div>
      <span>Tailoring your resume with Claude AI... this may take 20–40 seconds.</span>
    </div>

    <div class="status error" id="errorStatus"></div>
  </div>

  <script>
    const fileInput = document.getElementById('resumeFile');
    const fileName = document.getElementById('fileName');
    const uploadArea = document.getElementById('uploadArea');
    const form = document.getElementById('tailorForm');
    const submitBtn = document.getElementById('submitBtn');
    const loadingStatus = document.getElementById('loadingStatus');
    const errorStatus = document.getElementById('errorStatus');

    fileInput.addEventListener('change', () => {
      fileName.textContent = fileInput.files[0] ? fileInput.files[0].name : '';
    });

    uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('dragover'); });
    uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
    uploadArea.addEventListener('drop', e => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      if (e.dataTransfer.files[0]) {
        fileInput.files = e.dataTransfer.files;
        fileName.textContent = e.dataTransfer.files[0].name;
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorStatus.style.display = 'none';
      loadingStatus.style.display = 'flex';
      submitBtn.disabled = true;

      const formData = new FormData(form);

      try {
        const res = await fetch('/tailor', { method: 'POST', body: formData });
        if (!res.ok) {
          let msg = 'Something went wrong.';
          try {
            const err = await res.json();
            msg = err.detail || msg;
          } catch (_) {
            msg = await res.text() || msg;
          }
          throw new Error(msg);
        }
        const blob = await res.blob();
        const disposition = res.headers.get('content-disposition') || '';
        const match = disposition.match(/filename="?([^"]+)"?/);
        const name = match ? match[1] : 'tailored_resume.docx';

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = name;
        a.click();
        URL.revokeObjectURL(url);
      } catch (err) {
        errorStatus.textContent = err.message;
        errorStatus.style.display = 'block';
      } finally {
        loadingStatus.style.display = 'none';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
